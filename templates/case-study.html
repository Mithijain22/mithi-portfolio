<!doctype html>
<html lang="en">
<head>
{{> head}}
<script type="module" src="/src/site/site.ts"></script>
</head>
<body class="site">
<div class="grain" aria-hidden="true"></div>
{{> nav}}
<main id="main">
  <header class="cs-header cw-{{cw}}">
    <p class="index">{{index}}</p>
    <div class="cs-hero">
      <h1 class="cs-title">{{projectTitle}}</h1>
      <div class="cs-image-wrap">
        <div class="cs-title cs-flip" aria-hidden="true">{{projectTitle}}</div>
        {{{art}}}
      </div>
    </div>
    <p class="script annotation">{{annotation}}</p>
  </header>
  <dl class="meta-row">
    <div><dt>ROLE</dt><dd>{{role}}</dd></div>
    <div><dt>TIMELINE</dt><dd>{{timeline}}</dd></div>
    <div><dt>TOOLS</dt><dd>{{tools}}</dd></div>
    <div><dt>OUTCOME</dt><dd>{{outcome}}</dd></div>
  </dl>
  {{{sections}}}
  <nav class="next-block" aria-label="Case study navigation">
    <a class="next-link" href="/work/{{nextSlug}}"><span>NEXT PROJECT</span><strong>{{nextTitle}}</strong></a>
    <a class="all-link" href="/#work">ALL WORK</a>
  </nav>
</main>
{{> footer}}
</body>
</html>
